[data]
db_path = "buff.db"
out_path = "out/ratings.db"
from = "2013-01-01"
to = "2026-09-05"
w_in_person = 1.0
w_strict_sync = 0.6666666666666666
w_sync = 0.5
w_async = 0.0
# Per-player and per-team rows are written every Nth weekly release (plus the last one);
# releases and their listed counts stay weekly. 1 is every release.
rows_every = 1
passes = 2

[question]
b_bar = 1.5
s_b = 2.0
s_a = 0.5
# s_m = 0 fixes m at 1, the nested noisy-OR baseline.
s_m = 0.0
s_aff = 0.3
aff_rank = 0
eta_v = 0.2
# "take_rate" is the closed-form difficulty of DESIGN 3.3 step 1; "newton" is the
# Newton fit it replaced, kept selectable.
fit = "take_rate"

[player]
mu_new = -1.0
sigma_new = 1.0
# Restart width for --passes 2; see the report.
warm_sigma = 0.5
warm_until = "2016-01-01"
info_scale = 0.46
teammate_shrink = 0.005
tau_p = 0.25
v_min = 0.05
v_max = 0.6
v_eta = 0.15
tau_aff = 0.05

[gauge]
n_est = 8
window_days = 365

[team]
# "s2" is the shipped engine of DESIGN 4; "kalman" is the legacy filter of
# DESIGN 8.3 and reproduces the old numbers with the constants below.
engine = "s2"
# beta and sigma_model come from `calibrate`; see the report.
sigma_model = 0.3669
roster_bias = -0.2427
sigma_new_team = 0.5
beta = 0.3757
kappa_m = 10.0
m_max = 2.0
nu = 2.6
e_cap = 20.0
rho = 0.8
miss_streak = 3
gamma = 2.0
tau_t = 0.2
v_min = 0.05
v_max = 0.6
v_eta = 0.15
# The switches of DESIGN 8.2; these values are the shipped model.
# Multiplies the precision the margin channel contributes; 0 removes the channel.
margin_prec_scale = 1.0
# Lower bound on sigma after an update: a minimum K-factor.
sigma_floor = 0.2
# Variance is divided by forget^(w*c) before each rated update: fading memory in games.
forget = 1.0
# Prior inflation when |z_raw| exceeds this, by min((z_raw/z0)^2, surprise_max); 0 is off.
surprise_z0 = 0.0
surprise_max = 9.0
# Inflate only on a result worse than expected.
surprise_down_only = false
# Multiplies a negative mean step.
k_down = 1.0
# The margin channel moves the mean, from s* recalibrated by (s* - intercept)/slope.
margin_mean = false
margin_slope = 1.0
margin_intercept = 0.0
# Residual sd of that recalibration; falls back to sigma_model.
# margin_sigma = 0.3340

# Model S2, the shipped engine. Everything above this line belongs to "kalman".
[team.s2]
# D is the maximum-likelihood scale of the pairwise outcomes; K and k_q are tuned
# on the in-person forecast Spearman, 2018-09-01 to 2024-08-29.
D = 1200.0
K = 0.4
k_q = 0.01
# "roster" is the roster estimate of DESIGN 4.1 and ignores delta; "mean" is the
# average of the lineup's ratings less delta per seat short of six.
lineup = "roster"
delta = 150.0
# theta -> the team scale: player_zero + player_scale * (theta + ln 6 + roster_bias).
player_scale = 2454.8828
player_zero = 6000.0

[truedl]
# Six equal players at the strength of a balanced 251-500 team; fixed at launch.
theta_ref = 0.2368

[display]
# Fitted by `calibrate --display` so that the 50th and 1000th teams and players
# of the 2019 releases match the old system; under engine = "kalman" the team
# map was -209.5770 + 2454.8828 mu.
a_team = -7295.3562
b_team = 1.1904
a_player = 5543.6775
b_player = 4723.7898
provisional_sigma = 0.3

[numeric]
newton_iters = 12
newton_tol = 1e-4
a_min = 0.3
a_max = 3.0
m_min = 0.5
m_max = 4.0
b_min = -10.0
b_max = 12.0
exp_lo = -60.0
exp_hi = 30.0
info_floor = 1e-3
theta_max_step = 1.5
u_max = 15.0
crossfit_seed = 20250829
