[model]
# The version of the rules. Bump it with any change that moves a published
# number, so two outputs can be compared knowing which rules made each.
version = "1.5.0"

[data]
db_path = "buff.db"
out_path = "out/ratings.db"
from = "2013-01-01"
# No `to`: the window ends today (UTC), so the daily run picks up new tournaments.
# `--to` on the command line still overrides it.
# Every rated format weighs the same for the players: a synchronous package
# weighing more than a face-to-face table, as the blind refit chose (1.5), is
# not a rule to publish. Against 1.5 it is -0.0013 +/- 0.0023 on 2023-2024 and
# +0.0031 +/- 0.0017 on 2025-01-01..2026-08-27.
w_in_person = 1.0
w_strict_sync = 1.0
w_sync = 1.0
# Only the official rating's tournaments: no asynchronous ones. The view with
# Elo on /players/ and tournament pages trains on everything (see update.sh).
w_async = 0.0
# Per-player and per-team rows are written every Nth weekly release (plus the last one);
# releases and their listed counts stay weekly. 1 is every release, 0 the last one only.
# This is the only config that keeps the history; the research configs use 0.
rows_every = 1
# One pass from 2013. Nothing before publish_from is published: 2013-2015 only
# teach the model where players stand. The two-pass warm start it replaces
# forecast better (+0.003 test NDCG) but published early tables that used
# knowledge from 2016.
passes = 1
publish_from = "2016-01-01"
# City merges: fields join when they share editors and question count, are at
# most two days apart and rating.chgk.info links them as one package; a
# question is dropped only where a whole venue skipped it.
merge_cities = true
merge_days = 2
merge_venue_drop = true
# One person entered under two ids that rating.chgk.info has since merged;
# tools/fetch/player_merges.py rebuilds the list from the official API.
player_aliases = "data/player_aliases.csv"
# The tournaments the official system leaves out, for the player side only, at
# w_unrated: they move theta and phi, open no team state, write no team event
# and enter no metric. Off in A2; on in the view with Elo.
train_unrated = false
w_unrated = 0.5

[question]
# From b_bar down to the [team.s2] lineup, the forecast's constants are those
# of the second blind refit (2026-10-09): chosen from a random start on
# in-person tournaments of 2023-2024, with data cut at 2025-01-01. On
# 2025-01-01..2026-08-27 they tie the hand-tuned set they replace (-0.0015 +/-
# 0.0032). The comments below that quote a measurement made it on that set.
b_bar = 3.82
s_b = 5
s_a = 0.5
# s_m = 0 fixes m at 1, the nested noisy-OR baseline.
s_m = 0.0
s_aff = 0.3
aff_rank = 0
eta_v = 0.2
# "newton" fits each question's difficulty and discrimination to which lineups
# took it, under the priors b_bar/s_b and s_a; "take_rate" is the closed form
# of DESIGN 3.3 step 1, which matches the count of takes exactly at a = 1.
fit = "newton"
# The per-player format effect of DESIGN 3.7. "in_person" adds phi at an
# in-person table and nothing elsewhere; "signed" subtracts it at a synchronous
# one and lost; "none" is the model without it. Off since 2026-10-09: it
# measured as noise (tune -0.0006, test +0.0015, se 0.0015 / 0.0024), two
# blind refits dropped it, and it was the main source of the cold-start error.
format_effect = "none"
s_phi = 0.3
# A second per-player scalar read at a synchronous table, the asymmetric answer
# to "signed". Measured and off; it costs 0.0035 of weighted tune NDCG.
sync_effect = false
s_psi = 0.3
# One global collaboration exponent: P = (1 - e^-u)^m. 1 is the noisy-OR; the
# blind refit chose 1.59.
m_fixed = 1.59
# One global discrimination at an in-person table, where Newton starts from.
a_in_person = 0.515
# Each member enters the likelihood at theta + var_boost * var, so a lineup's
# unsettled players take more of its credit (the closed-team case of player
# 101843). Measured and off on the
# blind set, -0.0007 +/- 0.0015 at 0.25 and -0.0054 +/- 0.0018 at 0.5 on
# 2025-01-01..2026-08-27.
var_boost = 0.0
# Credit inside a lineup shared as lambda^(1/share_temp) instead of lambda / u.
# Measured and off: it moves player 101843 from 15th to 33rd at 6 (-0.0008 +/-
# 0.0019 on 2025-01-01..2026-08-27) and leaves his teammates where they were.
# Sharper shares, 0.7 and 0.8, are within 0.001 everywhere (2026-10-16).
share_temp = 0.0
# A strength per team id, added to its members. Measured and off: -0.008 to
# -0.010 on 2025-01-01..2026-08-27 at prior sds 0.3 to 1.
team_effect_sd = 0.0
team_effect_tau = 0.0
# Lineup chemistry inside the likelihood: u -> u * exp(chem_u * T(L)).
# Measured and off; -0.0018 at 0.05 and -0.031 at 0.2.
chem_u = 0.0
# A lineup of n reads at (6/n)^size_k times its summed intensity (size_k_long
# above six). The plain sum expects a trio to take two questions in 36 fewer
# than it does and inflates its members' ratings to make up. 0.3 gains
# +0.0011 +/- 0.0005 weighted pair on 2018-09-01..2024-12-31 and
# +0.0018 +/- 0.0007 on 2025-01-01..2026-08-27.
size_k = 0.3
size_k_long = 0.3
# Whether the editor affinity is a property of every player ("none") or of a
# strong one ("scale", multiplied by exp(aff_kappa*theta); "gate", only the top
# aff_gate of the established panel). Measured and off: every variant loses, and
# the tighter the gate the less it loses, which is the shape of "the best amount
# of this affinity is none". See DESIGN 8.2.
aff_strength = "none"
aff_kappa = 1.0
aff_s_max = 5.0
aff_gate = 0.0
# Relative player updates (DESIGN 4.9): each lineup is judged against the
# lineups of similar expected score in its own field, under a Gaussian kernel
# of rel_h expected answers. Its forecast place sets the direction of every
# member's step: at or above it the players cannot lose, below it they cannot
# gain. A rule of fairness, not of accuracy: against the winner-only rule it
# is tune +0.0011 (se 0.0011), test -0.0014 (se 0.0015). rel_winner is the
# special case for first place and is not read while rel_place is on.
rel_h = 12.0
rel_winner = true
rel_place = true

[player]
mu_new = -0.738
# A player whose first game is in a school, student or novice field (src/age.rs)
# starts this much lower: such a field cannot place them against adults. Young
# fields +0.035 / +0.036 per-field Pearson on tune / test; open fields unmoved.
mu_young = -0.25
sigma_new = 0.7
# Restart width for --passes 2; see the report.
warm_sigma = 0.5
warm_until = "2016-01-01"
info_scale = 0.5
# A newcomer's first ten games move them at most 0.2 each, and partners who
# play three quarters of their games together drift to one score (1.1).
# Against the same model without them: -0.0038 +/- 0.0032 NDCG on
# 2018-09-01..2024-12-31 and -0.0065 +/- 0.0042 on 2025-01-01..2026-08-27.
new_cap = 0.2
new_cap_games = 10
pair_pull = 0.2
pair_pull_games = 30
pair_pull_share = 0.75
# Only the lower partner moves up. Measured and off (2026-10-14): the partners
# still tie, one step higher, and Pearson falls 0.0029 +/- 0.0007 on
# 2018-09-01..2024-12-31 and 0.0034 +/- 0.0011 on 2025-01-01..2026-08-27.
pair_pull_up = false
teammate_shrink = 0.000685
# Share that pull by uncertainty, var / mean var of the lineup. Measured and
# off on the hand-tuned set: -0.0001 on tune at 0.0025, worse at larger pulls.
shrink_by_var = false
# The pull above is not allowed to take back what the winner rule protects:
# 2145 of 25,725 winning player-games lost up to 15 points to it.
shrink_keeps_floor = true
tau_p = 0.106
v_min = 0.0541
v_max = 0.46
v_eta = 0.131
tau_aff = 0.05
# Diffusion of phi between a player's tournaments. 0 makes the format effect a
# constant per player, which is what the tune window prefers.
tau_phi = 0.0
# Age phi from the player's last in-person tournament rather than their last
# tournament of any format. Measured and off.
tau_phi_own = false
# A newcomer starts this share of the way from mu_new to their rated
# teammates' mean. Measured and off on the blind set: -0.0014 +/- 0.0018 at 0.5
# and -0.0027 +/- 0.0014 at 0.25 on 2025-01-01..2026-08-27.
seed_w = 0.0
# Newcomer boost, rating.chgk.fun's multiplier. Measured and off: -0.005 to
# -0.028 on 2025-01-01..2026-08-27.
new_boost = 0.0
new_boost_games = 0
# The star cap: a player leading their lineup by star_margin or more gains at
# most star_cap of theta a year from such tournaments, so a team's surplus
# over a lineup of unsettled players goes to them rather than to its one
# established member (player 101843: 15th -> 110th). Free on the forecast:
# -0.0001 +/- 0.0015 on 2023-2024 and +0.0010 +/- 0.0021 on 2025-01-01..
# 2026-08-27; caps 0.03 and 0.07 and margins 0.3 and 0.7 are all within noise.
# 0.1 since 1.4: against no cap every measure is within one SE on both windows
# (NDCG@3 -0.0003 +/- 0.0027 and -0.0002 +/- 0.0053), while 0.05 costs NDCG@3
# 0.0065 +/- 0.0050 on 2025-01-01..2026-08-27. Without a cap the leaders of
# weak lineups top the table (player 21026 over 28751).
star_cap = 0.1
star_margin = 0.5
# Volatility floor of a second, fast estimate of the same strength, read only by
# the forecast through team.s2.k_fast. Measured and off: recent form is a worse
# predictor than the long-run estimate at every setting tried.
v_fast = 0.0
# Extra diffusion of theta per year of absence beyond the first, so a player
# back after years away is no longer held to their last season. Off since 1.5:
# 0.2 cost about 0.0003 weighted pair on both windows.
tau_gap = 0.0
# A player's gain per game fades with the games played: learn * G / (G + games).
learn = 0.004
learn_games = 100

[gauge]
n_est = 8
window_days = 365
# The published scale follows the gauge at most 0.05 theta (about 210 points)
# a release. In September 2021 the reference group shrank to seven players and
# the gauge moved every rating by 1722 points, then back; the model still
# reads the gauge itself, which forecasts better, but nobody's published
# number jumps with it.
publish_step = 0.05
# The lockdown: from March 2020 the reference group fell from 40 000 players to
# none, and those who stayed eight games deep were the strongest, so the gauge
# lowered every published number by about 1500 points and raised it again in
# 2021-22. The published scale stands still over those months and then glides
# to where the gauge settled, about 400 points lower than before.
publish_hold_from = "2020-03-12"
publish_hold_until = "2022-07-01"

[team]
# "s2" is the shipped engine of DESIGN 4; "kalman" is the legacy filter of
# DESIGN 8.3 and reproduces the old numbers with the constants below.
engine = "s2"
# beta and sigma_model come from `calibrate`; see the report.
sigma_model = 0.3669
roster_bias = -0.2427
sigma_new_team = 0.5
beta = 0.3757
kappa_m = 10.0
m_max = 2.0
nu = 2.6
e_cap = 20.0
rho = 0.8
miss_streak = 3
gamma = 2.0
tau_t = 0.2
v_min = 0.05
v_max = 0.6
v_eta = 0.15
# The switches of DESIGN 8.2; these values are the shipped model.
# Multiplies the precision the margin channel contributes; 0 removes the channel.
margin_prec_scale = 1.0
# Lower bound on sigma after an update: a minimum K-factor.
sigma_floor = 0.2
# Variance is divided by forget^(w*c) before each rated update: fading memory in games.
forget = 1.0
# Prior inflation when |z_raw| exceeds this, by min((z_raw/z0)^2, surprise_max); 0 is off.
surprise_z0 = 0.0
surprise_max = 9.0
# Inflate only on a result worse than expected.
surprise_down_only = false
# Multiplies a negative mean step.
k_down = 1.0
# The margin channel moves the mean, from s* recalibrated by (s* - intercept)/slope.
margin_mean = false
margin_slope = 1.0
margin_intercept = 0.0
# Residual sd of that recalibration; falls back to sigma_model.
# margin_sigma = 0.3340

# Model S2, the shipped engine. Everything above this line belongs to "kalman".
[team.s2]
# D is the maximum-likelihood scale of the pairwise outcomes. K is tuned on the
# in-person forecast Spearman, 2018-09-01 to 2024-08-29; k_r and k_q on the
# weighted team NDCG of DESIGN 7.3 over the same window.
D = 1200.0
# Retuned to 0.8 for the fair rule of DESIGN 4.3 (no pull), on the weighted team
# NDCG of the tune window; 0.4 was the optimum with the pull.
K = 0.8
# Re-tuned with the pull from 0.01: the usual lineup has to track the real one at
# about the speed the rating does, or the offset of step 1 counts today's table twice.
k_q = 0.1
# The lineup rule of DESIGN 4.1: "tempered" is the roster estimate at temperature
# tau, "roster" is tau = 1, "mean" is the average less delta per seat short of
# six and "best6" is chgk.gg's weighted top six. delta belongs to the last two.
lineup = "best6"
tau = 0.791
# Each player enters the lineup at theta - sigma_c * sigma: an unknown counts for
# less than a known player of the same estimate. The blind refit reads every
# player at their estimate.
sigma_c = 0.0
# Widens that discount for a player with little in-person evidence, by
# 1 + sigma_ip / (1 + n_in_person). Measured and off: it buys nothing the
# residual asks for and costs 0.010 of the synchronous forecast Spearman.
sigma_ip = 0.0
# How much of the fast estimate the forecast reads. Measured and off.
k_fast = 0.0
# The lineup's own spread, on top of the mean shift of sigma_c. Measured and
# off, and negative at both signs.
sigma_v = 0.0
# Sharpen the temperature when the field itself is bunched. Measured and off.
tau_spread = 0.0
# The same discount taken once for the whole lineup, as a multiple of the sd of
# the roster estimate. Measured and off: sd(Q(L)) correlates 0.93 with the mean
# sigma the per-player rule already reads, so there is nothing new in it.
q_sigma_c = 0.0
# A quantile that depends on the field: below a 1st-to-4th forecast gap of
# tight_gap display points the forecast reads each player at sigma_c_tight and
# above it at sigma_c_loose, leaving Q(L) and the rating at sigma_c either way.
# Measured and off: the best cell is 0.0000 +/- 0.0004 on tune, and a global
# sigma_c of 1.25, 1.75 or 2.0 is worse than 1.5, so 1.5 is where the data puts
# it and one number is enough.
tight_gap = 0.0
sigma_c_tight = 1.5
sigma_c_loose = 1.5
# Display points below the weakest member that fill each seat short of six.
# 1100 since 1.1: refit on 2018-09-01..2024-12-31 Pearson +0.0011 +/- 0.0004
# against 700, and +0.004 NDCG on 2025-01-01..2026-08-27.
delta = 1100.0
# Under "best6", a seat short of six is filled at no more than this, so a strong
# lineup that turns up five loses what a strong sixth player adds. 9000 since
# 1.4: +0.0043 +/- 0.0028 weighted NDCG@3 on 2018-09-01..2024-12-31 and
# +0.0022 +/- 0.0065 on 2025-01-01..2026-08-27, and synchronous open fields
# +0.008 / +0.014 per-field Pearson; 8000, 9500 and 10000 do worse.
fill_max = 9000.0
# The forecast's own lineup since 1.5, at every table: seat weights 0.7^k + 0.05
# down the sorted lineup and empty seats as below. Q(L) above
# stays the rating's. The forecast place steers the fair rule, so ratings move
# too. Against 1.4 on 2025-01-01..2026-08-27: rated sync NDCG +0.0059 +/- 0.0013
# and Pearson +0.0093, async NDCG +0.0117 +/- 0.0015, weighted in-person NDCG
# +0.0006 +/- 0.0019 (2018-09..2024: +0.0000, Pearson +0.0019 +/- 0.0007).
# Decay 0.65 and 0.75 and a cap of 8000 are within noise in person and worse on
# 2022-2024 sync. Measured and off: only at sync tables it costs in-person
# NDCG 0.004 through the fair rule.
fc_seat_decay = 0.7
fc_seat_floor = 0.05
# An empty seat is worth 0.4 of the strongest member plus 3000, uncapped, since
# 1.5: a pair scores about 2:1 by its stronger player, and the weakest less
# delta read it 1:2. With the seat rule alone swapped in the stored forecasts on
# 2025-01-01..2026-08-27, sync Pearson +0.0015 +/- 0.0004, pair score of lineups
# of one to three +0.004, in person within noise; 0.3-0.5 and 4000-5000 do no
# better on 2018-09..2024, a constant seat costs up to 0.06 Pearson, and
# fc_fill_max = 7500 binds above a strongest member of 11250.
fc_fill_top = 0.4
fc_fill_const = 3000.0
fc_fill_max = 0.0
fc_seat_sync_only = false
# theta -> the team scale: player_zero + player_scale * (theta + ln 6 + roster_bias).
player_scale = 2454.8828
player_zero = 6000.0
# The pull of DESIGN 4.3 step 3: per rated game the rating takes this much of the
# gap to what the lineup that turned up is worth. Tuned on the weighted team NDCG,
# 2018-09-01 to 2024-08-29; see out/team_ndcg/report.md. 0 is the rule it replaced.
# Off since 2026-09-27: no result moves a team towards the players it fielded.
k_r = 0.0
# "lineup" is the lineup that turned up, "usual" the running average of them.
k_r_target = "lineup"
# Multiplier on the pull at synchronous tournaments; 0 confines it to in-person
# games. Measured and at 1: confining it is +0.0004 +/- 0.0048 on tune and
# -0.0025 on test, so a lineup that only ever plays synchrons does not mislead
# the rating about the base-roster field (DESIGN 4.9).
k_r_sync = 1.0
# A team that finished first keeps at least the rating it came with. Without the
# pull the Elo step alone already guarantees it and the floor never binds.
winner_floor = true
# The two-part rating of DESIGN 4.9: R = Q(core) + b, the core being the team's
# base-roster players weighted by attendance (k_c) and b the team effect, which
# only the placement step moves and which decays by k_b per rated game. It
# replaces the pull, so k_r above is not read. Measured and off since
# 2026-09-27: it lets a team that loses with strong guests rise, 63% of such
# losses, which the fair rule forbids.
two_part = false
k_c = 0.1
k_b = 0.2
core_base = true
# The fair rule of DESIGN 4.3. The sign of a team's change follows its published
# forecast place: at or above it the team cannot lose, below it cannot gain.
place_sign = true
# The lineup is read against the team's base roster, weighted by attendance, at
# today's player ratings, rather than against the usual lineup of k_q.
ref_core = true
# A new team starts at 80% of its first lineup on the published scale, the
# chgk.gg rule: that share of the way from its strength to the internal rating
# that publishes as 0.
start_frac = 0.2
# A fixed constant near -a_team / b_team (3868 at the map below), so the start
# is 80% on the published scale to within half a percent.
start_zero = 4171.7

# The editor memory of DESIGN 4.8. For every pair of a player and an editor the
# engine keeps the mean of (forecast place - actual place) / n over the in-person
# fields that player has played under that editor, and a lineup's forecast gains
# `editor_memory` display points per unit of the mean of those. It is read at an
# in-person table only and by the forecast only: no rating, no usual lineup, no
# player strength and no question difficulty sees it, and every synchronous
# forecast is what it was without it.
editor_memory = 1380.0
# Display points per unit of the lineup's mean 1 / (1 + in-person games), at an
# in-person table and on the forecast alone: players new to the table play below
# the strength their synchronous games earned. On top of mu_young, young
# in-person fields +0.025 / +0.016 per-field Pearson; open fields unmoved.
# -800 with ip_new_sync = 0.2 since 1.5, against -600 and 0: weighted pair
# +0.0004 +/- 0.0003 on 2018-09-01..2024-12-31 and +0.0011 +/- 0.0004 on
# 2025-01-01..2026-08-27, unweighted +0.0020 and +0.0029, strong fields abroad
# +0.0004 and +0.0011. 0.1, 0.3, -1000 and the g0 scaling below do worse.
k_ip_new = -800.0
# Each game not played in person counts as this much of one that was, so a
# strong player who rarely gets to an in-person table is not taken for a novice.
ip_new_sync = 0.2
# Measured and off: freshness times g0 / (g0 + all games) at g0 of 10 and 30
# costs strong fields abroad up to 0.0012 weighted pair.
ip_new_g0 = 0.0
# Measured and off: in fields whose top ten lineups average strong_top or more,
# k_ip_new times ip_new_strong and editor_memory times ed_strong. At 11000 and
# 0, the editor memory gains strong fields abroad 0.0009 / 0.0005 weighted pair
# and costs their NDCG@3 0.013 on 2025-01-01..2026-08-27; the penalty is noise.
strong_top = 0.0
ip_new_strong = 1.0
ed_strong = 1.0
# Past results a (player, editor) pair needs before it counts.
ed_min_n = 2.85
# Only players in the top ed_gate of the established panel carry a memory: the
# residual says the effect is a property of a strong lineup.
ed_gate = 0.444
# Years after which an entry counts for half; 0 never forgets. Measured and off:
# -0.0010 at two years and -0.0007 at four, against a residual check that
# expected the opposite.
ed_half_life = 0.0
# What the memory is keyed on: "player_editor" one memory per player,
# "team_editor" (shipped) one memory per table and "player_set" the editors' whole set.
ed_key = "team_editor"
# How much of the memory the in-person format effect takes, which is the one
# form of it that reaches the rating. Measured and off: -0.0017 at every rate.
ed_phi = 0.0
# How the forecast orders a field: "mean" by each lineup's strength, "erel" by
# E[1/place] under draws of the lineups' own uncertainty, "p_first" by the share
# of draws won, "erel_d" by E[1/place] with the pairwise noise of D added.
# Measured and off. rank_sd scales the sd before the draws and rank_gap confines
# the sampling to fields whose 1st-to-4th gap is under that many points.
rank_rule = "mean"
rank_draws = 66
rank_sd = 1.38
rank_gap = 0.0
# Display points the forecast gains when at least home_min of a lineup has
# played out of the tournament's own town before, and the same for the town the
# team itself is registered in. Measured and off at both signs, although the
# residual separates home from away at four standard errors.
home_bonus = 0.0
home_min = 0.369
home_team_bonus = 0.0
# Display points per in-person tournament each player has already played in the
# trailing 7 and 30 days, averaged over the lineup. Measured and off.
load_7 = 0.0
load_30 = 0.0
# The chemistry of DESIGN 4.9: display points per unit of T(L), the mean over the
# pairs of a lineup of log(1 + rated games together). Measured and off, and the
# worst-behaved thing in this round: negative at every strength and both signs.
chemistry = 0.0
# Rank a field by the expected answers on a package of the difficulty a field of
# this strength usually gets, instead of by Q(L). Measured and off.
difficulty_forecast = false
# Display points per unit of a team's mean surprise over its last series_k
# in-person results. Measured and off: positive on tune at a negative kappa and
# negative on test, which is what noise looks like.
kappa_s = 0.0
series_k = 4
# The switches of DESIGN 4.9, all at the value that changes nothing.
# Questions of score gap worth a whole win; 0 is the win/lose rule.
margin_g = 0.0
margin_shape = "linear"
# Rated games below which the step is enlarged to K n0 / n; 0 is off.
n0 = 0.0
# The team side's own format weights; absent means the shared [data] ones.
# w_sync = 0.75
# w_strict_sync = 1.0

[truedl]
# Six equal players at the strength of a balanced 251-500 team; fixed at launch.
theta_ref = 0.2368

[display]
# Fitted by `calibrate --display` so that the 50th and 1000th teams and players
# of the 2019 releases match the old system; under engine = "kalman" the team
# map was -209.5770 + 2454.8828 mu, and under the pull -7383.8881 + 1.2421 mu.
# Refitted for the fair rule on 2026-09-27; the player map is unchanged.
a_team = -4115.3755
b_team = 1.0640
a_player = 5738.6039
b_player = 4269.2612
provisional_sigma = 0.3
# How much of the format effect the published player number carries; with
# format_effect = "none" there is none, so the number is the strength itself.
player_phi = 0.0
# The player table ranks everyone by the rating less 2.75 sigma, the lower
# 0.3% bound, so a provisional rating sits where its evidence allows.
rank_sigmas = 2.75
# The blind refit saw no data from this day on; tournament pages from this
# day show every system's forecast NDCG.
clean_from = "2025-01-01"

[numeric]
newton_iters = 12
newton_tol = 1e-4
a_min = 0.3
a_max = 3.0
m_min = 0.5
m_max = 4.0
b_min = -10.0
b_max = 12.0
