[data]
db_path = "buff.db"
out_path = "out/ratings.db"
from = "2013-01-01"
# No `to`: the window ends today (UTC), so the daily run picks up new tournaments.
# `--to` on the command line still overrides it.
w_in_person = 1.0
w_strict_sync = 0.6666666666666666
w_sync = 0.5
w_async = 0.0
# Per-player and per-team rows are written every Nth weekly release (plus the last one);
# releases and their listed counts stay weekly. 1 is every release, 0 the last one only.
# This is the only config that keeps the history; the research configs use 0.
rows_every = 1
passes = 2
# The tournaments the official system leaves out, for the player side only: they
# move theta and phi, open no team state, write no team event and enter no
# metric. Measured and off: +0.0002 +/- 0.0018 on tune and -0.0037 +/- 0.0019 on
# test, over the same 650 and 284 fields, with 1126 extra tournaments trained on.
train_unrated = false
w_unrated = 0.5

[question]
b_bar = 1.5
s_b = 2.0
s_a = 0.5
# s_m = 0 fixes m at 1, the nested noisy-OR baseline.
s_m = 0.0
s_aff = 0.3
aff_rank = 0
eta_v = 0.2
# "take_rate" is the closed-form difficulty of DESIGN 3.3 step 1; "newton" is the
# Newton fit it replaced, kept selectable.
fit = "take_rate"
# The per-player format effect of DESIGN 3.7. "in_person" adds phi at an
# in-person table and nothing elsewhere; "signed" subtracts it at a synchronous
# one and lost; "none" is the model without it.
format_effect = "in_person"
s_phi = 0.3
# A second per-player scalar read at a synchronous table, the asymmetric answer
# to "signed". Measured and off; it costs 0.0035 of weighted tune NDCG.
sync_effect = false
s_psi = 0.3
# One global collaboration exponent: P = (1 - e^-u)^m, with the take-rate
# difficulty solved from r^(1/m). 1 is the noisy-OR. The optimum on the tune
# window is 1.1 and it is worth +0.0004 +/- 0.0005, which is nothing.
m_fixed = 1.0
# One global discrimination at an in-person table, with the take-rate difficulty
# solved at that a. Measured and off: negative on both sides of 1.
a_in_person = 1.0
# Lineup chemistry inside the likelihood: u -> u * exp(chem_u * T(L)).
# Measured and off; -0.0018 at 0.05 and -0.031 at 0.2.
chem_u = 0.0
# Whether the editor affinity is a property of every player ("none") or of a
# strong one ("scale", multiplied by exp(aff_kappa*theta); "gate", only the top
# aff_gate of the established panel). Measured and off: every variant loses, and
# the tighter the gate the less it loses, which is the shape of "the best amount
# of this affinity is none". See DESIGN 8.2.
aff_strength = "none"
aff_kappa = 1.0
aff_s_max = 5.0
aff_gate = 0.0

[player]
mu_new = -1.0
sigma_new = 1.0
# Restart width for --passes 2; see the report.
warm_sigma = 0.5
warm_until = "2016-01-01"
info_scale = 0.46
# Retuned on the merged model: the optimum moved from 0.005 once `phi` was
# absorbing part of what the shrinkage used to correct.
teammate_shrink = 0.0025
tau_p = 0.25
v_min = 0.05
v_max = 0.6
v_eta = 0.15
tau_aff = 0.05
# Diffusion of phi between a player's tournaments. 0 makes the format effect a
# constant per player, which is what the tune window prefers.
tau_phi = 0.0
# Age phi from the player's last in-person tournament rather than their last
# tournament of any format. Measured and off.
tau_phi_own = false
# Volatility floor of a second, fast estimate of the same strength, read only by
# the forecast through team.s2.k_fast. Measured and off: recent form is a worse
# predictor than the long-run estimate at every setting tried.
v_fast = 0.0

[gauge]
n_est = 8
window_days = 365

[team]
# "s2" is the shipped engine of DESIGN 4; "kalman" is the legacy filter of
# DESIGN 8.3 and reproduces the old numbers with the constants below.
engine = "s2"
# beta and sigma_model come from `calibrate`; see the report.
sigma_model = 0.3669
roster_bias = -0.2427
sigma_new_team = 0.5
beta = 0.3757
kappa_m = 10.0
m_max = 2.0
nu = 2.6
e_cap = 20.0
rho = 0.8
miss_streak = 3
gamma = 2.0
tau_t = 0.2
v_min = 0.05
v_max = 0.6
v_eta = 0.15
# The switches of DESIGN 8.2; these values are the shipped model.
# Multiplies the precision the margin channel contributes; 0 removes the channel.
margin_prec_scale = 1.0
# Lower bound on sigma after an update: a minimum K-factor.
sigma_floor = 0.2
# Variance is divided by forget^(w*c) before each rated update: fading memory in games.
forget = 1.0
# Prior inflation when |z_raw| exceeds this, by min((z_raw/z0)^2, surprise_max); 0 is off.
surprise_z0 = 0.0
surprise_max = 9.0
# Inflate only on a result worse than expected.
surprise_down_only = false
# Multiplies a negative mean step.
k_down = 1.0
# The margin channel moves the mean, from s* recalibrated by (s* - intercept)/slope.
margin_mean = false
margin_slope = 1.0
margin_intercept = 0.0
# Residual sd of that recalibration; falls back to sigma_model.
# margin_sigma = 0.3340

# Model S2, the shipped engine. Everything above this line belongs to "kalman".
[team.s2]
# D is the maximum-likelihood scale of the pairwise outcomes. K is tuned on the
# in-person forecast Spearman, 2018-09-01 to 2024-08-29; k_r and k_q on the
# weighted team NDCG of DESIGN 7.3 over the same window.
D = 1200.0
K = 0.4
# Re-tuned with the pull from 0.01: the usual lineup has to track the real one at
# about the speed the rating does, or the offset of step 1 counts today's table twice.
k_q = 0.1
# The lineup rule of DESIGN 4.1: "tempered" is the roster estimate at temperature
# tau, "roster" is tau = 1, "mean" is the average less delta per seat short of
# six and "best6" is chgk.gg's weighted top six. delta belongs to the last two.
lineup = "tempered"
tau = 0.7
# Each player enters the lineup at theta - sigma_c * sigma: an unknown counts for
# less than a known player of the same estimate.
sigma_c = 1.5
# Widens that discount for a player with little in-person evidence, by
# 1 + sigma_ip / (1 + n_in_person). Measured and off: it buys nothing the
# residual asks for and costs 0.010 of the synchronous forecast Spearman.
sigma_ip = 0.0
# How much of the fast estimate the forecast reads. Measured and off.
k_fast = 0.0
# The lineup's own spread, on top of the mean shift of sigma_c. Measured and
# off, and negative at both signs.
sigma_v = 0.0
# Sharpen the temperature when the field itself is bunched. Measured and off.
tau_spread = 0.0
# The same discount taken once for the whole lineup, as a multiple of the sd of
# the roster estimate. Measured and off: sd(Q(L)) correlates 0.93 with the mean
# sigma the per-player rule already reads, so there is nothing new in it.
q_sigma_c = 0.0
# A quantile that depends on the field: below a 1st-to-4th forecast gap of
# tight_gap display points the forecast reads each player at sigma_c_tight and
# above it at sigma_c_loose, leaving Q(L) and the rating at sigma_c either way.
# Measured and off: the best cell is 0.0000 +/- 0.0004 on tune, and a global
# sigma_c of 1.25, 1.75 or 2.0 is worse than 1.5, so 1.5 is where the data puts
# it and one number is enough.
tight_gap = 0.0
sigma_c_tight = 1.5
sigma_c_loose = 1.5
delta = 150.0
# theta -> the team scale: player_zero + player_scale * (theta + ln 6 + roster_bias).
player_scale = 2454.8828
player_zero = 6000.0
# The pull of DESIGN 4.3 step 3: per rated game the rating takes this much of the
# gap to what the lineup that turned up is worth. Tuned on the weighted team NDCG,
# 2018-09-01 to 2024-08-29; see out/team_ndcg/report.md. 0 is the rule it replaced.
k_r = 0.3
# "lineup" is the lineup that turned up, "usual" the running average of them.
k_r_target = "lineup"
# Multiplier on the pull at synchronous tournaments; 0 confines it to in-person
# games. Measured and at 1: confining it is +0.0004 +/- 0.0048 on tune and
# -0.0025 on test, so a lineup that only ever plays synchrons does not mislead
# the rating about the base-roster field (DESIGN 4.9).
k_r_sync = 1.0
# A team that finished first keeps at least the rating it came with. Without the
# pull the Elo step alone already guarantees it and the floor never binds.
winner_floor = true

# The editor memory of DESIGN 4.8. For every pair of a player and an editor the
# engine keeps the mean of (forecast place - actual place) / n over the in-person
# fields that player has played under that editor, and a lineup's forecast gains
# `editor_memory` display points per unit of the mean of those. It is read at an
# in-person table only and by the forecast only: no rating, no usual lineup, no
# player strength and no question difficulty sees it, and every synchronous
# forecast is what it was without it.
editor_memory = 1250.0
# Past results a (player, editor) pair needs before it counts.
ed_min_n = 2.0
# Only players in the top fifth of the established panel carry a memory. The
# residual says the effect is a property of a strong lineup, and 0.2 is where the
# tune window puts it: 0 (every player) is +0.0010 against this row's +0.0015.
ed_gate = 0.2
# Years after which an entry counts for half; 0 never forgets. Measured and off:
# -0.0010 at two years and -0.0007 at four, against a residual check that
# expected the opposite.
ed_half_life = 0.0
# What the memory is keyed on: "player_editor" is the shipped rule,
# "team_editor" one memory per table and "player_set" the editors' whole set.
# Measured and off: the team key is -0.0019 at this constant and worse at larger
# ones, and the set key covers 0.3% of the results.
ed_key = "player_editor"
# How much of the memory the in-person format effect takes, which is the one
# form of it that reaches the rating. Measured and off: -0.0017 at every rate.
ed_phi = 0.0
# How the forecast orders a field: "mean" by each lineup's strength, "erel" by
# E[1/place] under draws of the lineups' own uncertainty, "p_first" by the share
# of draws won, "erel_d" by E[1/place] with the pairwise noise of D added.
# Measured and off. rank_sd scales the sd before the draws and rank_gap confines
# the sampling to fields whose 1st-to-4th gap is under that many points.
rank_rule = "mean"
rank_draws = 200
rank_sd = 1.0
rank_gap = 0.0
# Display points the forecast gains when at least home_min of a lineup has
# played out of the tournament's own town before, and the same for the town the
# team itself is registered in. Measured and off at both signs, although the
# residual separates home from away at four standard errors.
home_bonus = 0.0
home_min = 0.5
home_team_bonus = 0.0
# Display points per in-person tournament each player has already played in the
# trailing 7 and 30 days, averaged over the lineup. Measured and off.
load_7 = 0.0
load_30 = 0.0
# The chemistry of DESIGN 4.9: display points per unit of T(L), the mean over the
# pairs of a lineup of log(1 + rated games together). Measured and off, and the
# worst-behaved thing in this round: negative at every strength and both signs.
chemistry = 0.0
# Rank a field by the expected answers on a package of the difficulty a field of
# this strength usually gets, instead of by Q(L). Measured and off.
difficulty_forecast = false
# Display points per unit of a team's mean surprise over its last series_k
# in-person results. Measured and off: positive on tune at a negative kappa and
# negative on test, which is what noise looks like.
kappa_s = 0.0
series_k = 5
# The switches of DESIGN 4.9, all at the value that changes nothing.
# Questions of score gap worth a whole win; 0 is the win/lose rule.
margin_g = 0.0
margin_shape = "linear"
# Rated games below which the step is enlarged to K n0 / n; 0 is off.
n0 = 0.0
# The team side's own format weights; absent means the shared [data] ones.
# w_sync = 0.75
# w_strict_sync = 1.0

[truedl]
# Six equal players at the strength of a balanced 251-500 team; fixed at launch.
theta_ref = 0.2368

[display]
# Fitted by `calibrate --display` so that the 50th and 1000th teams and players
# of the 2019 releases match the old system; under engine = "kalman" the team
# map was -209.5770 + 2454.8828 mu.
a_team = -7383.8881
b_team = 1.2421
a_player = 5738.6039
b_player = 4269.2612
provisional_sigma = 0.3
# How much of the format effect the published player number carries: 1 is
# theta + phi, the strength at an in-person table, which is the number the
# external player tables mean. The forecast never reads this.
player_phi = 1.0

[numeric]
newton_iters = 12
newton_tol = 1e-4
a_min = 0.3
a_max = 3.0
m_min = 0.5
m_max = 4.0
b_min = -10.0
b_max = 12.0
exp_lo = -60.0
exp_hi = 30.0
info_floor = 1e-3
theta_max_step = 1.5
u_max = 15.0
crossfit_seed = 20250829
