[data]
db_path = "buff.db"
out_path = "out/q3/base.db"
from = "2013-01-01"
to = "2026-09-05"
w_in_person = 1.0
w_strict_sync = 0.6666666666666666
w_sync = 0.5
w_async = 0.0
# Per-player and per-team rows are written every Nth weekly release (plus the last one);
# releases and their listed counts stay weekly. 1 is every release, 0 the last one only.
# This is the only config that keeps the history; the research configs use 0.
rows_every = 0
passes = 2

[question]
b_bar = 1.5
s_b = 2.0
s_a = 0.5
# s_m = 0 fixes m at 1, the nested noisy-OR baseline.
s_m = 0.0
s_aff = 0.3
aff_rank = 0
eta_v = 0.2
# "take_rate" is the closed-form difficulty of DESIGN 3.3 step 1; "newton" is the
# Newton fit it replaced, kept selectable.
fit = "take_rate"
# The per-player format effect of DESIGN 3.7. "in_person" adds phi at an
# in-person table and nothing elsewhere; "signed" subtracts it at a synchronous
# one and lost; "none" is the model without it.
format_effect = "in_person"
s_phi = 0.3

[player]
mu_new = -1.0
sigma_new = 1.0
# Restart width for --passes 2; see the report.
warm_sigma = 0.5
warm_until = "2016-01-01"
info_scale = 0.46
teammate_shrink = 0.0025
tau_p = 0.25
v_min = 0.05
v_max = 0.6
v_eta = 0.15
tau_aff = 0.05
# Diffusion of phi between a player's tournaments.
tau_phi = 0.0

[gauge]
n_est = 8
window_days = 365

[team]
# "s2" is the shipped engine of DESIGN 4; "kalman" is the legacy filter of
# DESIGN 8.3 and reproduces the old numbers with the constants below.
engine = "s2"
# beta and sigma_model come from `calibrate`; see the report.
sigma_model = 0.3669
roster_bias = -0.2427
sigma_new_team = 0.5
beta = 0.3757
kappa_m = 10.0
m_max = 2.0
nu = 2.6
e_cap = 20.0
rho = 0.8
miss_streak = 3
gamma = 2.0
tau_t = 0.2
v_min = 0.05
v_max = 0.6
v_eta = 0.15
# The switches of DESIGN 8.2; these values are the shipped model.
# Multiplies the precision the margin channel contributes; 0 removes the channel.
margin_prec_scale = 1.0
# Lower bound on sigma after an update: a minimum K-factor.
sigma_floor = 0.2
# Variance is divided by forget^(w*c) before each rated update: fading memory in games.
forget = 1.0
# Prior inflation when |z_raw| exceeds this, by min((z_raw/z0)^2, surprise_max); 0 is off.
surprise_z0 = 0.0
surprise_max = 9.0
# Inflate only on a result worse than expected.
surprise_down_only = false
# Multiplies a negative mean step.
k_down = 1.0
# The margin channel moves the mean, from s* recalibrated by (s* - intercept)/slope.
margin_mean = false
margin_slope = 1.0
margin_intercept = 0.0
# Residual sd of that recalibration; falls back to sigma_model.
# margin_sigma = 0.3340

# Model S2, the shipped engine. Everything above this line belongs to "kalman".
[team.s2]
# D is the maximum-likelihood scale of the pairwise outcomes. K is tuned on the
# in-person forecast Spearman, 2018-09-01 to 2024-08-29; k_r and k_q on the
# weighted team NDCG of DESIGN 7.3 over the same window.
D = 1200.0
K = 0.4
# Re-tuned with the pull from 0.01: the usual lineup has to track the real one at
# about the speed the rating does, or the offset of step 1 counts today's table twice.
k_q = 0.1
# The lineup rule of DESIGN 4.1: "tempered" is the roster estimate at temperature
# tau, "roster" is tau = 1, "mean" is the average less delta per seat short of
# six and "best6" is chgk.gg's weighted top six. delta belongs to the last two.
lineup = "tempered"
tau = 0.7
# Each player enters the lineup at theta - sigma_c * sigma: an unknown counts for
# less than a known player of the same estimate.
sigma_c = 1.5
delta = 150.0
# theta -> the team scale: player_zero + player_scale * (theta + ln 6 + roster_bias).
player_scale = 2454.8828
player_zero = 6000.0
# The pull of DESIGN 4.3 step 3: per rated game the rating takes this much of the
# gap to what the lineup that turned up is worth. Tuned on the weighted team NDCG,
# 2018-09-01 to 2024-08-29; see out/team_ndcg/report.md. 0 is the rule it replaced.
k_r = 0.3
# "lineup" is the lineup that turned up, "usual" the running average of them.
k_r_target = "lineup"
# A team that finished first keeps at least the rating it came with. Without the
# pull the Elo step alone already guarantees it and the floor never binds.
winner_floor = true
# The switches of DESIGN 4.8, all at the value that changes nothing.
# Questions of score gap worth a whole win; 0 is the win/lose rule.
margin_g = 0.0
margin_shape = "linear"
# Rated games below which the step is enlarged to K n0 / n; 0 is off.
n0 = 0.0
# The team side's own format weights; absent means the shared [data] ones.
# w_sync = 0.75
# w_strict_sync = 1.0

[truedl]
# Six equal players at the strength of a balanced 251-500 team; fixed at launch.
theta_ref = 0.2368

[display]
# Fitted by `calibrate --display` so that the 50th and 1000th teams and players
# of the 2019 releases match the old system; under engine = "kalman" the team
# map was -209.5770 + 2454.8828 mu.
a_team = -7383.8881
b_team = 1.2421
a_player = 5738.6039
b_player = 4269.2612
provisional_sigma = 0.3
player_phi = 1.0

[numeric]
newton_iters = 12
newton_tol = 1e-4
a_min = 0.3
a_max = 3.0
m_min = 0.5
m_max = 4.0
b_min = -10.0
b_max = 12.0
exp_lo = -60.0
exp_hi = 30.0
info_floor = 1e-3
theta_max_step = 1.5
u_max = 15.0
crossfit_seed = 20250829
