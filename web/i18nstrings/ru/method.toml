# The methodology at /method/: DESIGN.md sections 1–6 in the plain register of
# the site. Written in English for now; the owner translates it here.
lede = "How the rating is computed, in short. An earlier version of the model, with formulas, is described in the"
report = "report (PDF)"

[team]
title = "What a team rating is"
sum = "A team rating is the sum of the team's seven best current results, divided by seven. An empty slot counts as zero, so a team needs seven good results to reach its full level. Every team page shows the seven, what each was worth and what is left of it, so the number can be checked by hand."
value = "A result is valued once, on the day of the tournament, and never revalued afterwards. Its value is the strength the team showed, divided by its place to the power 0.6, times the weight of the tournament. A win keeps the whole strength, second place 66% of it, fifth 38%, tenth 25%. A result with no per-question data is valued by the strength at which its place is what the field's lineups predict, under the same divisor."
strength = "The strength the team showed is that of a lineup of six equal players who would expect to take as many questions on that package as the team took. Question difficulty comes from the question model below, so the same number of answers is worth more on a harder package, and a lead over the field counts in full."

[weight]
title = "The weight of a tournament"
product = "The weight is the product of three factors."
format = "Format: in-person 1, strictly synchronous 2/3, synchronous 0.5. Asynchronous tournaments do not count."
field = "Field: the average strength of the tournament's twenty strongest lineups, placed between 5000, which weighs 0, and 10000, which weighs 1. A tournament with fewer than twenty lineups is averaged over the lineups it has, and its weight is then multiplied by the square root of its number of lineups over twenty, so a strong small field counts, but less than a strong full one."
reach = "Reach, in person only: the number of towns the teams come from, divided by 24, to the power 0.6, and never more than 1. A field drawn from 24 towns or more keeps its whole weight; a league played within one city keeps about a seventh."
merged = "Several cities playing one package within two days of each other are one tournament for the team rating, with one set of places by questions taken, ties sharing the place. They are merged only when they have the same editors and question count, their questions' take rates agree (a correlation of at least 0.5), and no team played at two of them. A question that a whole venue did not play is dropped at all of them, so every team plays for the same questions. A tournament played in one place keeps its official places, shootouts included. Individual ratings treat every venue as its own tournament."

[time]
title = "Time and lineup"
fade = "A result worth 9000 loses 10% of its value each year if it was played in person and 40% if it was synchronous. A result's age runs at (9000 / its value) to the power 0.6, so weaker results fade faster: a typical in-person result, worth about 700, loses about 40% a year, and a typical synchronous one nearly all of it within the year. A team that stops playing keeps its seven results, and its rating only falls; it can rise only by a new result that enters the seven."
roster = "A result counts for the team whose number it was played under, whoever sat at the table. If the team's base roster has since changed, the result keeps only part of its value: the share of that season's roster, weighted by the players' ratings over the six strongest, that is still on the roster today, to the power 0.6. A team that loses its strongest player loses more than one that loses its weakest."
listed = "A team is in the table while it has a base roster for the season (in the first sixty days of a season, last season's roster is enough) and at least one counted result in the past 365 days. A result flagged as unrated counts for no team; the players who played it are rated on it as usual."
search = "The constants above were chosen by searching thousands of combinations for the one that best predicts the order of teams in real tournaments, with a few fixed in advance for clarity: seven results, the format weights, and a rating that never grows while a team is idle. On in-person tournaments of the last two seasons it orders fields of teams playing in their base rosters about as well as the previous rule did."

[player]
title = "Individual rating"
model_lead = "Player strength is estimated from a question model. Each question has a difficulty, each player has a strength and an uncertainty. On each question a player has an"
intensity = "intensity"
model_alone = ", the rate at which they find the answer: 1 when their strength equals the difficulty, rising by a factor of e for every unit above it and falling by the same for every unit below. A player alone answers with probability 1 − e"
sup_intensity = "−intensity"
model_table = ". Intensities of a table add up, and the team answers with probability (1 − e"
sup_sum = "−sum"
model_tail = ")^1.59; the power makes a table less than the sum of its players. Uncertainty plays no part in this chance; it only sets how far the estimate moves afterwards. Each question also has a sharpness: how cleanly it separates strong lineups from weak ones. Its difficulty and sharpness are fitted to which lineups answered it, each pulled towards a typical value so that a question taken by two teams of thirty is not read as extreme. This is what makes packages from different years and levels comparable."
published = "Individual numbers are published as they are, with their uncertainty, with no ladder rules and no rounding to grades. One number per player serves every format: a player is assumed to be as strong at a synchronous package as at a face-to-face table. A player with no history enters at the average strength of a newcomer with a wide uncertainty. After each tournament four more rules apply. A lineup's players are judged against the lineups whose expected score was close to their own (within about twelve answers), not against the whole field. Before the tournament every lineup gets a forecast place: if it finishes at or above that place its players cannot lose strength from the tournament, and if it finishes below it they cannot gain. Each player is pulled 0.07% of the way towards the mean of the lineup they played in. And a player who leads their lineup by more than about 2100 points gains at most about 210 points a year from such tournaments: what the lineup takes beyond that is left to their teammates, so a team of one established player and several new ones does not credit the established one with all of it."

[scale]
title = "Scale"
anchor = "At every release the scale is anchored to the population: the mean strength of players with at least eight rated tournaments in the past year is set to zero. This shift is subtracted from every player. Team values rest on the same anchor, because the strength a team showed is read on the same scale as the players. The published scale follows this anchor but moves at most 0.05 (about 210 points) from one release to the next, so a week in which the reference group shrinks, as in the lockdown of 2021, does not move every rating at once. The accumulated shift is shown on the"
releases = "releases"
tail = " page."

[uncertainty]
title = "Uncertainty"
body = "Players carry a ± next to the rating: the root-mean-square uncertainty of the estimate. A rating with a large one is provisional. The width is driven by the player's own volatility. A steady, predictable history squeezes it towards the floor and a run of results unlike the past opens it again. It also grows with the time since the player's last game, at the rate of the player's own volatility. The player table ranks everyone, provisional or not, by the rating less 2.75 uncertainties, its lower 0.3% bound, so a rating resting on little evidence stands no higher than that evidence allows; the number shown is the rating itself."

[forecast]
title = "Forecast"
lineup = "The forecast for a tournament is separate from the rating and takes no part in the update. A team's forecast strength is the strength of the lineup it fielded, computed from individual ratings: the players are sorted from strongest to weakest and averaged with weights 6, 5, 4, 3, 2 and 1, and each seat short of six is filled by the weakest player less 700 points. The forecast places are the order of the field by that strength. About tomorrow, the lineup knows more than the accumulated team rating: on in-person tournaments of the last two seasons this forecast beats both the team rating and the forecast of the old system."
editors = "At an in-person tournament the forecast carries one small correction that is not about the lineup: how the team has fared before under the editors of this package. A weak player misses a question whoever wrote it, so only lineups with a player in the strongest 44% carry such a record, and a team and an editor need three shared tournaments before the record counts. Everything else in the system ignores it — no rating, no player number and no question difficulty moves because of it, and a synchronous forecast never reads it. It is worth a few points of forecast quality and it is the only place in the model where who wrote the questions changes what we expect."
quality = "The tournament page shows the forecast next to the result. Forecast quality is measured two ways and compared with the other systems: by Spearman rank correlation over the whole field, and by a top-weighted measure that counts a swap at the first places for far more than one deep in the table, averaged over tournaments with the strong fields counting most. The forecast's constants were chosen blind, from a random start, on in-person tournaments of 2023 and 2024, with no data from 2025 on; a few rules of principle, such as the forecast place that no lineup can lose by reaching, were fixed by hand. For tournaments from 1 January 2025 the tournament page also shows the same measure for the old system's own forecast and for rating.chgk.fun, chgk.quest and chgk.gg as we reimplement them."

[difficulty]
title = "Package difficulty"
body = "Package difficulty is a single estimate, shared by all tournaments, of how hard the questions were: the higher the number, the fewer questions teams of one and the same strength would answer. It comes from the same question model as the player ratings, so packages of different years, formats and fields compare directly."

[count]
title = "Which tournaments count"
formats = "Rated tournaments from 1 January 2013 count; those before 2016 inform the ratings but no release is published for them. For individual ratings every rated format weighs the same; team ratings use the weights above. Asynchronous tournaments are never rated. Marathons are excluded."
players = "The player table includes players who played at least one rated tournament in the last 365 days. A player entered under two ids that rating.chgk.info has since merged counts as one."

[publication]
title = "Publication"
body = "Tournaments are processed once, in date order, and releases come out on Thursdays. Tournaments from 2013 to 2015 only teach the model where players stand; the first published release is the first Thursday of 2016, and every published number uses only results from before its date. Every morning the whole history is recomputed from the current data and rules, so a past release can change when either changes."

