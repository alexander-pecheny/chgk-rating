note_merged = "Один пакет сыгран на нескольких площадках, поэтому зачёт сводный: место — по взятым вопросам среди всех команд, прогноз — по силе составов. Выбор площадки оставляет её команды и показывает места на ней. В рейтинге команд вопрос, снятый на одной площадке, снят на всех, поэтому место там может отличаться."
