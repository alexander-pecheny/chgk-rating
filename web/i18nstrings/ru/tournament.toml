note_value = "Ценность — сколько результат стоит в рейтинге команды: сила игры, делённая на место в степени 0,6 и умноженная на вес турнира. Прочерк — результат не идёт в зачёт команде. Прибавка — насколько вырос рейтинг команды, когда результат вошёл в семь её лучших; результат, не вошедший в них, рейтинг не меняет."
note_split = "Δ складывается из двух шагов. За место — насколько команда обошла ожидание по силе команд в поле или не дотянула до него; чем больше поле, тем меньше весит одно место. К составу — доля разрыва между рейтингом и силой состава, которую рейтинг проходит за каждую зачтённую игру: так рейтинг узнаёт, кто сидит за столом, а не только кто кого обошёл."
note_floor = "Победитель не теряет очков: если шаги в сумме ушли в минус, разница возвращается."
